{% extends "base.html" %}{% block title %}Log in · SpamGuard{% endblock %}
{% block body %}<form class="auth" method="post"><h1>Log in</h1>
<input type="hidden" name="csrf" value="{{ csrf_token() }}">
<label>Email<input type="email" name="email" required autofocus></label>
<label>Password<input type="password" name="password" required></label>
<button class="btn">Log in</button><p class="meta">New here? <a href="{{ url_for('register') }}">Create an account</a></p></form>{% endblock %}
