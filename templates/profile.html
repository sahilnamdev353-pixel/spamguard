{% extends "base.html" %}{% block title %}Profile · SpamGuard{% endblock %}
{% block body %}<h1>Your profile</h1>
<div class="card who"><span class="avatar">{{ u.name[:1]|upper }}</span><div><b>{{ u.name }}</b><br><span class="meta">{{ u.email }} · member since {{ u.created_at[:10] }} · {{ total }} checks, {{ spam }} spam</span></div></div>
<div class="two"><form method="post" class="card form"><h2>Change name</h2><input type="hidden" name="csrf" value="{{ csrf_token() }}"><input type="hidden" name="action" value="name">
<label>Name<input name="name" value="{{ u.name }}" maxlength="60" required></label><button class="btn">Save name</button></form>
<form method="post" class="card form"><h2>Change password</h2><input type="hidden" name="csrf" value="{{ csrf_token() }}"><input type="hidden" name="action" value="password">
<label>Current password<input type="password" name="current" required></label><label>New password (8+ characters)<input type="password" name="new" minlength="8" required></label>
<label>Confirm new password<input type="password" name="confirm" minlength="8" required></label><button class="btn">Change password</button></form></div>{% endblock %}
