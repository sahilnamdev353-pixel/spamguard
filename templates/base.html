<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}SpamGuard{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body>
<header class="nav"><a class="brand" href="{{ url_for('index') }}">SpamGuard</a>
<nav><a href="{{ url_for('about') }}">About</a>
{% if g.user %}<a href="{{ url_for('dashboard') }}">Check a message</a><a href="{{ url_for('history') }}">History</a>
<form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><button class="link">Log out ({{ g.user.name }})</button></form>
{% else %}<a href="{{ url_for('login') }}">Log in</a><a class="btn small" href="{{ url_for('register') }}">Create account</a>{% endif %}
</nav></header>
<main>{% for m in get_flashed_messages() %}<p class="flash">{{ m }}</p>{% endfor %}{% block body %}{% endblock %}</main>
<footer>SpamGuard is a college project. The model can be wrong, so check important messages yourself.</footer>
</body></html>
