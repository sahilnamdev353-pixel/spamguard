{% extends "base.html" %}{% block title %}Create account · SpamGuard{% endblock %}
{% block body %}<form class="auth" method="post"><h1>Create account</h1>
<input type="hidden" name="csrf" value="{{ csrf_token() }}">
<label>Name<input name="name" maxlength="60" required autofocus></label>
<label>Email<input type="email" name="email" required></label>
<label>Password (8+ characters)<input type="password" name="password" minlength="8" required></label>
<label>Confirm password<input type="password" name="confirm" minlength="8" required></label>
<button class="btn">Create account</button><p class="meta">Already registered? <a href="{{ url_for('login') }}">Log in</a></p></form>{% endblock %}
